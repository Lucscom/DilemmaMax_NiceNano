# Dilemma Max - Shield configuration

# Encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB LED strip (WS2812/SK6805/SK6812mini via SPIM3, GRB)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
# AUTO_OFF_IDLE steht pro Seite in config/dilemma_max_{left,right}.conf:
# links schaltet selbst ab, rechts wird vom Central gesteuert.

# Bluetooth TX Power (+8 dBm fuer bessere Reichweite im Split-Betrieb)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Deep Sleep nach 15 Minuten
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Pointing: benoetigt fuer Maus-Scroll via Encoder (&msc) + Cirque Trackpad
CONFIG_ZMK_POINTING=y
CONFIG_I2C=y
CONFIG_INPUT=y

