# Dilemma Max - nur linke Haelfte (Central)

# Keine Idle-Abschaltung durch ZMK: die ist fest auf CONFIG_ZMK_IDLE_TIMEOUT einkompiliert.
# Das Abdunkeln macht src/power.c nach der im Menue eingestellten Zeit und gibt den Zustand
# per Split-Kommando an die rechte Haelfte weiter (src/rgb_split_sync.c).
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n

# Slave Latency wieder auf dem ZMK-Standard (30 Intervalle a 7.5 ms): das Peripheral
# muss damit nur alle 225 ms zuhoeren statt alle 75 ms. Das spart auf der rechten
# Seite Funkbetrieb rund um die Uhr, ein Underglow-Kommando kommt dafuer spaeter an.

# nice!view: eigenes Layout aus src/status_screen.c statt des Shield-Widgets,
# siehe CONFIG_DILEMMA_MAX_STATUS_SCREEN
CONFIG_NICE_VIEW_WIDGET_STATUS=n
