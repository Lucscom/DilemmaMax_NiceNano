# Dilemma Max - nur linke Haelfte (Central)

# Das Central behaelt die eigene Idle-Abschaltung: es bekommt die Tastendruecke
# beider Haelften als position_state_changed und merkt sich den Zustand vor dem
# Idle. Den Peripherals gibt es den Zustand per Split-Kommando weiter, siehe
# CONFIG_DILEMMA_MAX_RGB_SPLIT_SYNC (src/rgb_split_sync.c).
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Das Peripheral darf per Slave Latency bis zu 30 Verbindungsintervalle (a 7.5 ms)
# ueberspringen, bevor es zuhoeren muss - ein Kommando vom Central kommt damit erst
# nach bis zu 225 ms an, das sieht man dem Underglow beim Aufwachen an. Auf 10
# reduziert sind es maximal 75 ms. Kostet auf der rechten Seite ein paar hundertstel
# mA mehr Funkbetrieb, gegen 51 LEDs faellt das nicht ins Gewicht. Nur beim Central
# vorhanden: die Verbindungsparameter werden von dort ausgehandelt.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=10
