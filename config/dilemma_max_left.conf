# Dilemma Max - nur linke Haelfte (Central)

# Das Central behaelt die eigene Idle-Abschaltung: es bekommt die Tastendruecke
# beider Haelften als position_state_changed und merkt sich den Zustand vor dem
# Idle. Den Peripherals gibt es den Zustand per Split-Kommando weiter, siehe
# CONFIG_DILEMMA_MAX_RGB_SPLIT_SYNC (src/rgb_split_sync.c).
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
