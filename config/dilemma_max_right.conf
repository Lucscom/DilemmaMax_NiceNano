# Dilemma Max - nur rechte Haelfte (Peripheral)

# Keine eigene Idle-Abschaltung: die rechte Haelfte sieht nur ihre eigenen Tasten
# und wuerde dunkel bleiben, solange man links tippt. Den Zustand gibt das Central
# vor, siehe CONFIG_DILEMMA_MAX_RGB_SPLIT_SYNC (src/rgb_split_sync.c).
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
